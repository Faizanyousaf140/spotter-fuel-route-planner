<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 15px; }
    button { margin-top: 16px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
    pre { background: #f6f8fa; padding: 12px; overflow-x: auto; font-size: 12px; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Fuel Route Planner</h1>
  <p class="muted">Calls <code>POST /api/v1/route/</code> and opens the saved Leaflet map. Inputs: "City, ST" or "lat,lng" inside the USA.</p>
  <form id="f">
    <label for="start">Start</label><input id="start" value="New York, NY" required>
    <label for="finish">Finish</label><input id="finish" value="Los Angeles, CA" required>
    <button type="submit">Plan route</button>
  </form>
  <p id="status" class="muted"></p>
  <pre id="out" hidden></pre>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status"), out = document.getElementById("out");
      status.textContent = "Planning..."; out.hidden = true;
      const res = await fetch("/api/v1/route/", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ start: document.getElementById("start").value, finish: document.getElementById("finish").value }),
      });
      const body = await res.json();
      if (res.ok) {
        status.innerHTML = `Total fuel cost $${body.fuel_cost.total_fuel_cost.toFixed(2)} &middot; ${body.fuel_stops.length} stop(s) &middot; ` +
          `<a href="${body.map_url}">open map</a>`;
        window.location.href = body.map_url;
      } else {
        status.textContent = `Error ${res.status}`;
        out.textContent = JSON.stringify(body, null, 2); out.hidden = false;
      }
    });
  </script>
</body>
</html>
